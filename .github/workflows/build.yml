name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - sp

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits since last release
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"* %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"* %s" --no-merges "$PREV_TAG"..HEAD)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build standard version
        run: npx gulp clean build

      - name: Package standard version
        run: cd dist && zip -q -r ../AriaNg-${{ steps.version.outputs.VERSION }}-standard.zip . && cd ..

      - name: Build all-in-one version
        run: npx gulp clean build-bundle

      - name: Package all-in-one version
        run: cd dist && zip -q -r ../AriaNg-${{ steps.version.outputs.VERSION }}-all-in-one.zip index.html && cd ..

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: AriaNg v${{ steps.version.outputs.VERSION }}
          body: |
            AriaNg v${{ steps.version.outputs.VERSION }}

            Two distribution archives are attached:
            - AriaNg-${{ steps.version.outputs.VERSION }}-standard.zip: standard multi-file build for web server deployment (on-demand loading).
            - AriaNg-${{ steps.version.outputs.VERSION }}-all-in-one.zip: single-file build for local use, just open index.html in a browser.

            ## Changes since last release

            ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            AriaNg-${{ steps.version.outputs.VERSION }}-standard.zip
            AriaNg-${{ steps.version.outputs.VERSION }}-all-in-one.zip
          overwrite_files: true
          fail_on_unmatched_files: true